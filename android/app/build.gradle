plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace 'fr.corsicalib.membres'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.corsicalib.membres'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.3'
    }
    buildFeatures { buildConfig true }
    def origin = providers.gradleProperty('memberOrigin').getOrElse('http://127.0.0.1:8000')
    if (!(origin == 'http://127.0.0.1:8000' || origin ==~ /https:\/\/[a-zA-Z0-9.-]+(:[0-9]+)?/)) {
        throw new GradleException('Adresse du serveur membre invalide')
    }
    defaultConfig.buildConfigField 'String', 'ORIGIN', '"' + origin + '"'

    def releaseKeystore = System.getenv('CORSICA_RELEASE_KEYSTORE')
    def releaseAlias = System.getenv('CORSICA_RELEASE_KEY_ALIAS')
    def releaseStorePassword = System.getenv('CORSICA_RELEASE_STORE_PASSWORD')
    def releaseKeyPassword = System.getenv('CORSICA_RELEASE_KEY_PASSWORD')
    signingConfigs {
        release {
            if (releaseKeystore && releaseAlias && releaseStorePassword && releaseKeyPassword) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.test'
        }
        release {
            if (origin == 'http://127.0.0.1:8000') {
                throw new GradleException('Une origine HTTPS publique est obligatoire pour une version Play Store')
            }
            if (!(releaseKeystore && releaseAlias && releaseStorePassword && releaseKeyPassword)) {
                throw new GradleException('Signature de publication manquante')
            }
            signingConfig signingConfigs.release
        }
    }
}
