plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace 'fr.corsicalib.membres'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.corsicalib.membres'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.3'
    }
    buildFeatures { buildConfig true }
    def origin = providers.gradleProperty('memberOrigin').getOrElse('http://127.0.0.1:8000')
    if (!(origin == 'http://127.0.0.1:8000' || origin ==~ /https:\/\/[a-zA-Z0-9.-]+(:[0-9]+)?/)) {
        throw new GradleException('Adresse du serveur membre invalide')
    }
    defaultConfig.buildConfigField 'String', 'ORIGIN', '"' + origin + '"'
    buildTypes {
        debug {
            applicationIdSuffix '.test'
        }
    }
}
