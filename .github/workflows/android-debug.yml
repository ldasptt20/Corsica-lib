name: Android debug build

on:
  push:
    branches: [feature/android-build-validation]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: corsica-lib-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
